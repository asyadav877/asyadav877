<svg width="860" height="400" viewBox="0 0 860 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- terminal window -->
  <rect x="4" y="4" width="852" height="392" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="4" y="4" width="852" height="44" rx="14" fill="#161b22"/>
  <rect x="4" y="34" width="852" height="14" fill="#161b22"/>
  <circle cx="34" cy="26" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="26" r="7" fill="#febc2e"/>
  <circle cx="82" cy="26" r="7" fill="#28c840"/>
  <text x="430" y="31" text-anchor="middle" font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="13" fill="#8b949e">ashish@razorpay — zsh — 80×24</text>

  <g font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="17">

    <!-- line 1: whoami -->
    <clipPath id="t1"><rect x="30" y="70" width="0" height="26">
      <animate attributeName="width" from="0" to="330" begin="0.6s" dur="0.9s" fill="freeze"/>
    </rect></clipPath>
    <text x="30" y="90" clip-path="url(#t1)"><tspan fill="#7ee787">➜</tspan><tspan fill="#79c0ff" dx="10">~</tspan><tspan fill="#e6edf3" dx="10">whoami</tspan></text>

    <text x="30" y="122" fill="#e6edf3" opacity="0">Ashish Yadav — Senior DevOps Engineer 🥷
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.2s" fill="freeze"/>
    </text>

    <!-- line 2: cat profile -->
    <clipPath id="t2"><rect x="30" y="140" width="0" height="26">
      <animate attributeName="width" from="0" to="360" begin="2.2s" dur="1s" fill="freeze"/>
    </rect></clipPath>
    <text x="30" y="160" clip-path="url(#t2)"><tspan fill="#7ee787">➜</tspan><tspan fill="#79c0ff" dx="10">~</tspan><tspan fill="#e6edf3" dx="10">cat ~/.profile</tspan></text>

    <g opacity="0">
      <text x="30" y="192" fill="#8b949e">→ <tspan fill="#ffa657">4+ years</tspan><tspan fill="#e6edf3"> keeping prod alive @ </tspan><tspan fill="#58a6ff">Razorpay</tspan></text>
      <text x="30" y="222" fill="#8b949e">→ <tspan fill="#e6edf3">Kubernetes · AWS · Terraform · CI/CD · Observability</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.25s" fill="freeze"/>
    </g>

    <!-- line 3: uptime -->
    <clipPath id="t3"><rect x="30" y="240" width="0" height="26">
      <animate attributeName="width" from="0" to="330" begin="3.9s" dur="0.8s" fill="freeze"/>
    </rect></clipPath>
    <text x="30" y="260" clip-path="url(#t3)"><tspan fill="#7ee787">➜</tspan><tspan fill="#79c0ff" dx="10">~</tspan><tspan fill="#e6edf3" dx="10">uptime</tspan></text>

    <text x="30" y="292" opacity="0"><tspan fill="#7ee787">up 4+ years,</tspan><tspan fill="#e6edf3"> 0 unplanned reboots, </tspan><tspan fill="#ffa657">99.99% caffeinated</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="4.9s" dur="0.2s" fill="freeze"/>
    </text>

    <!-- line 4: motto -->
    <clipPath id="t4"><rect x="30" y="310" width="0" height="26">
      <animate attributeName="width" from="0" to="640" begin="5.4s" dur="1.4s" fill="freeze"/>
    </rect></clipPath>
    <text x="30" y="330" clip-path="url(#t4)"><tspan fill="#7ee787">➜</tspan><tspan fill="#79c0ff" dx="10">~</tspan><tspan fill="#e6edf3" dx="10">echo</tspan><tspan fill="#a5d6ff" dx="10">"automate everything, sleep through on-call"</tspan></text>

    <!-- blinking cursor -->
    <rect x="70" y="348" width="11" height="21" fill="#7ee787" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1.1s" begin="7s" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="365" opacity="0"><tspan fill="#7ee787">➜</tspan><tspan fill="#79c0ff" dx="10">~</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="7s" dur="0.1s" fill="freeze"/>
    </text>
  </g>
</svg>
