<svg width="860" height="320" viewBox="0 0 860 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- isometric cube: top, left, right faces -->
    <g id="cube">
      <polygon points="0,-20 40,0 0,20 -40,0" fill="#2ea043"/>
      <polygon points="-40,0 0,20 0,60 -40,40" fill="#196c2e"/>
      <polygon points="40,0 0,20 0,60 40,40" fill="#0f4a1f"/>
    </g>
    <g id="cube-blue">
      <polygon points="0,-20 40,0 0,20 -40,0" fill="#388bfd"/>
      <polygon points="-40,0 0,20 0,60 -40,40" fill="#1f5eb0"/>
      <polygon points="40,0 0,20 0,60 40,40" fill="#153e75"/>
    </g>
    <g id="cube-orange">
      <polygon points="0,-20 40,0 0,20 -40,0" fill="#f0883e"/>
      <polygon points="-40,0 0,20 0,60 -40,40" fill="#b05f22"/>
      <polygon points="40,0 0,20 0,60 40,40" fill="#7a3f12"/>
    </g>
  </defs>

  <rect x="1" y="1" width="858" height="318" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="30" y="34" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#8b949e">$ kubectl get nodes -o isometric <tspan fill="#7ee787">— cluster: production ⎈</tspan></text>

  <!-- platform -->
  <polygon points="430,290 720,190 430,90 140,190" fill="#161b22" stroke="#30363d"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="4s" repeatCount="indefinite"/>

    <!-- control plane (tall, blue, back center) -->
    <g transform="translate(430,120)">
      <use href="#cube-blue" transform="scale(1.15,1.5)"/>
      <circle cx="18" cy="38" r="3" fill="#7ee787"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="26" cy="43" r="3" fill="#ffa657"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="0" y="-38" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#79c0ff">control-plane</text>
    </g>

    <!-- worker pods -->
    <g transform="translate(290,170)">
      <use href="#cube"/>
      <circle cx="-18" cy="32" r="2.5" fill="#7ee787"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
      <text x="0" y="-28" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7ee787">pod/api</text>
    </g>
    <g transform="translate(430,215)">
      <use href="#cube"/>
      <circle cx="-18" cy="32" r="2.5" fill="#7ee787"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/></circle>
      <text x="0" y="72" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7ee787">pod/worker</text>
    </g>
    <g transform="translate(570,170)">
      <use href="#cube-orange"/>
      <circle cx="-18" cy="32" r="2.5" fill="#ffa657"><animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></circle>
      <text x="0" y="-28" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#ffa657">pod/ninja 🍥</text>
    </g>

    <!-- packets: control-plane <-> pods -->
    <circle r="4" fill="#79c0ff">
      <animate attributeName="cx" values="430;290" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;185" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#79c0ff">
      <animate attributeName="cx" values="430;570" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;185" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#7ee787">
      <animate attributeName="cx" values="430;430" dur="1.4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;225" dur="1.4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#ffa657">
      <animate attributeName="cx" values="570;430" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="185;150" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="700" y="300" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b949e">all systems <tspan fill="#7ee787">▲ healthy</tspan></text>
</svg>
