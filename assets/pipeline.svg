<svg width="860" height="150" viewBox="0 0 860 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="858" height="148" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="30" y="34" font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="13" fill="#8b949e">$ git push origin main <tspan fill="#7ee787">— pipeline triggered</tspan></text>

  <!-- track -->
  <line x1="90" y1="85" x2="770" y2="85" stroke="#30363d" stroke-width="3"/>
  <line x1="90" y1="85" x2="770" y2="85" stroke="#238636" stroke-width="3" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- traveling pulse -->
  <circle r="6" fill="#7ee787">
    <animate attributeName="cx" values="90;770" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="85;85" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.95;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="13" text-anchor="middle">
    <!-- COMMIT -->
    <circle cx="90" cy="85" r="17" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    <circle cx="90" cy="85" r="17" fill="none" stroke="#7ee787" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="17;27" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="90" fill="#7ee787">⎇</text>
    <text x="90" y="128" fill="#e6edf3">commit</text>

    <!-- BUILD -->
    <circle cx="260" cy="85" r="17" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <circle cx="260" cy="85" r="17" fill="none" stroke="#79c0ff" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="17;27" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="90" fill="#79c0ff">⚙</text>
    <text x="260" y="128" fill="#e6edf3">build</text>

    <!-- TEST -->
    <circle cx="430" cy="85" r="17" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
    <circle cx="430" cy="85" r="17" fill="none" stroke="#ffa657" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="17;27" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="430" y="90" fill="#ffa657">✓</text>
    <text x="430" y="128" fill="#e6edf3">test</text>

    <!-- DEPLOY -->
    <circle cx="600" cy="85" r="17" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <circle cx="600" cy="85" r="17" fill="none" stroke="#d2a8ff" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="17;27" dur="4s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="90" fill="#d2a8ff">🚀</text>
    <text x="600" y="128" fill="#e6edf3">deploy</text>

    <!-- MONITOR -->
    <circle cx="770" cy="85" r="17" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <circle cx="770" cy="85" r="17" fill="none" stroke="#ff7b72" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="17;27" dur="4s" begin="3.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4s" begin="3.9s" repeatCount="indefinite"/>
    </circle>
    <text x="770" y="90" fill="#ff7b72">📈</text>
    <text x="770" y="128" fill="#e6edf3">monitor</text>
  </g>
</svg>
